#
# web-readonly.yaml — Read-only access to package registries and GitHub.
#
# Allows GET requests to PyPI, npm, and GitHub for installing packages
# and cloning repos. Blocks all mutating operations (POST/PUT/DELETE)
# except the git-upload-pack endpoint needed by 'git clone'.
# All other hosts are blocked.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  pypi:
    name: PyPI (read-only)
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/pip }
      - { path: /usr/bin/pip3 }
      - { path: /usr/local/bin/pip }
      - { path: /usr/local/bin/pip3 }
      - { path: /usr/bin/uv }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      # Sandbox venv paths (default sandbox image uses /sandbox/.venv)
      - { path: "/sandbox/.venv/bin/pip*" }
      - { path: "/sandbox/.venv/bin/python*" }
      # uv-managed Python (resolved binary path)
      - { path: "/sandbox/.uv/python/**/python*" }
      # Catch-all for any venv location
      - { path: "/home/*/.venv/bin/pip*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  github:
    name: GitHub (read-only + git clone)
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          # Allow browsing
          - allow:
              method: GET
              path: "/**"
          # Allow git clone (smart HTTP protocol)
          - allow:
              method: GET
              path: "/**/info/refs*"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/bin/curl }

  npm:
    name: npm registry (read-only)
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/npm }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
