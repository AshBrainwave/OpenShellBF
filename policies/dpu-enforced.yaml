#
# dpu-enforced.yaml — DPU hardware-enforced policy.
#
# This policy allows broad L4 connectivity at the sandbox level,
# delegating actual enforcement to the BlueField-3 DPU's OVS flow table.
#
# Traffic path:
#   sandbox → guest eth1 → vf-bridge → host VF (enp179s0f0v0)
#   → BF3 eSwitch → DPU representor (pf0vf0) → OVS bridge (ovsbr1)
#   → OVS flow rules (drop/allow per destination IP:port)
#
# The DPU OVS pipeline provides:
#   - Default-deny (priority=50 drop on pf0vf0)
#   - Per-destination allow rules (priority=100)
#   - Hardware-level enforcement (host cannot bypass)
#
# Verify DPU enforcement:
#   ssh ubuntu@192.168.100.2
#   sudo ovs-ofctl dump-flows ovsbr1   # check pf0vf0 counters
#
# This demonstrates trust delegation: the sandbox proxy allows traffic,
# but the DPU's OVS bridge makes the final permit/deny decision.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# Broad L4 allow — real enforcement is on the DPU.
# Explicit hosts listed (the sandbox proxy allows these; DPU OVS
# flow rules make the final permit/deny decision at the wire).
# In production, this list would be compiled from DPU policy.
network_policies:
  web_https:
    name: HTTPS (DPU-enforced)
    endpoints:
      - { host: example.com, port: 443 }
      - { host: google.com, port: 443 }
      - { host: github.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      - { host: registry.npmjs.org, port: 443 }
      - { host: api.anthropic.com, port: 443 }
      - { host: api.openai.com, port: 443 }
      - { host: huggingface.co, port: 443 }
      - { host: cdn-lfs.huggingface.co, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/git }
      - { path: /usr/bin/pip }
      - { path: /usr/bin/pip3 }
      - { path: /usr/local/bin/pip }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/npm }
      - { path: "/sandbox/.venv/bin/pip*" }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/pip*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  web_http:
    name: HTTP (DPU-enforced)
    endpoints:
      - { host: example.com, port: 80 }
      - { host: google.com, port: 80 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
