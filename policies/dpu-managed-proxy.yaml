#
# dpu-managed-proxy.yaml
#
# Sandbox policy for the BF3 managed-proxy MVP.
# It keeps the policy source in OpenShell aligned with the first DPU control
# agent implementation by listing:
#   1. the DPU proxy endpoint the sandbox connects to explicitly, and
#   2. the upstream destinations the DPU proxy should allow.
#
# For this first proof, the command inside the sandbox must explicitly set:
#   HTTPS_PROXY=http://10.99.2.1:3128
#
# The DPU control agent will compile these destinations into DPU-local OPA
# policy, while the same policy remains visible in OpenShell history.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  dpu_proxy:
    name: DPU explicit proxy
    endpoints:
      - { host: 10.99.2.1, port: 3128 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  anthropic:
    name: Anthropic API via DPU proxy
    endpoints:
      - { host: api.anthropic.com, port: 443 }
      - { host: statsig.anthropic.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  openai:
    name: OpenAI API via DPU proxy
    endpoints:
      - { host: api.openai.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  test_https:
    name: Example HTTPS test target
    endpoints:
      - { host: example.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
