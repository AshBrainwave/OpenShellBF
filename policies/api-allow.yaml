#
# api-allow.yaml — Allow access to AI/ML API endpoints.
#
# Permits L4 connections to Anthropic, OpenAI, and HuggingFace APIs.
# All other hosts are blocked. Suitable for agent sandboxes that need
# to call LLM APIs but should not reach arbitrary internet destinations.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  anthropic:
    name: Anthropic API
    endpoints:
      - { host: api.anthropic.com, port: 443 }
      - { host: statsig.anthropic.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  openai:
    name: OpenAI API
    endpoints:
      - { host: api.openai.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  huggingface:
    name: HuggingFace
    endpoints:
      - { host: huggingface.co, port: 443 }
      - { host: cdn-lfs.huggingface.co, port: 443 }
      - { host: cdn-lfs-us-1.huggingface.co, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/git }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }

  # PyPI access for installing SDK packages
  pypi:
    name: PyPI (for SDK install)
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
    binaries:
      - { path: /usr/bin/pip }
      - { path: /usr/bin/pip3 }
      - { path: /usr/local/bin/pip }
      - { path: /usr/local/bin/pip3 }
      - { path: /usr/bin/python3 }
      - { path: "/usr/bin/python3.*" }
      - { path: "/sandbox/.venv/bin/pip*" }
      - { path: "/sandbox/.venv/bin/python*" }
      - { path: "/sandbox/.uv/python/**/python*" }
      - { path: "/home/*/.venv/bin/pip*" }
      - { path: "/home/*/.venv/bin/python*" }
      - { path: "/home/*/.uv/python/**/python*" }
