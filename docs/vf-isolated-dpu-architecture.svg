<text x="900" y="40" font-family="DejaVu Sans" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">OpenShell BF3 Target Architecture</text>
<text x="900" y="74" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#62717f">Per-sandbox VF isolation, per-sandbox DPU proxy containers, and a DPU-owned control plane</text>
<text x="900" y="1140" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#62717f">Policy is always per sandbox. Containers are the first isolation unit on the DPU; DPU VMs are a later hardening step.</text>
